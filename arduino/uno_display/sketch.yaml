# arduino-cli 빌드 프로필: 보드 코어와 라이브러리 버전을 고정한다.
#   arduino-cli compile --profile uno arduino/uno_display
#   arduino-cli upload  --profile uno -p COM5 arduino/uno_display      (파이: -p /dev/ttyUSB0)
profiles:
  uno:
    fqbn: arduino:avr:uno
    platforms:
      - platform: arduino:avr (1.8.8)
    libraries:
      - LiquidCrystal I2C (1.1.2)
default_profile: uno
