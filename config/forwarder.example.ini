; 대시보드 전송 서비스(4단계) 설정 예시. 복사해서 config/forwarder.ini로 쓴다 (git에 올라가지 않음)
;   python -m barcode_system.forwarder_app --config config/forwarder.ini
; 명령줄 옵션이 이 파일보다 우선한다. 상대 경로는 실행 위치(작업 폴더) 기준이다.

[api]
url = https://api.oswdev.cloud   ; 대시보드 API 주소 (뒤에 /api/scan 이 붙는다)
timeout = 10                     ; 요청 제한 시간(초). 응답이 없으면 대시보드 이력을 확인한 뒤 다시 보낸다

[forward]
types = CODE128           ; 보낼 바코드 종류 (쉼표로 구분). 대시보드 바코드는 CODE128
; device_id =             ; 대시보드에 보낼 deviceId. 비우면 스캐너 ID(dock-01 등)
send_existing = false     ; 처음 실행할 때 이미 저장돼 있던 스캔도 보낼지. false면 처음 실행 이후 받은 것만
poll = 2                  ; 새 스캔 확인 간격(초)

[db]
path = data/barcodes.db   ; db-writer가 쓰는 스캔 DB (읽기만 한다)
state = data/forwarder.db ; 전송 기록. 지우면 다음 실행을 '처음 실행'으로 본다 (send_existing 규칙 다시 적용)
