; 스캐너(1단계) 설정 예시. 복사해서 config/scanner.ini로 쓴다 (scanner.ini는 git에 올라가지 않음)
;   python -m barcode_system.scanner_app --config config/scanner.ini
; 명령줄 옵션이 이 파일보다 우선한다. 상대 경로는 실행 위치(작업 폴더) 기준이다.

[scanner]
id = dock-01              ; 영문/숫자/_/- . 토픽 warehouse/scanner/<id>/... 와 MQTT 사용자 이름에 쓰인다
camera = picam            ; usb | picam | files(이미지 폴더, 시연·테스트용)
index = 0                 ; USB 카메라 번호
width = 1280
height = 720
backend = auto            ; auto(Linux=v4l2, Windows=dshow) | v4l2 | dshow | msmf | any
; images = samples        ; camera = files 일 때 이미지 폴더
; fps = 10
engine = auto             ; auto | opencv | zbar
mode = interval           ; interval | presence
cooldown = 3.0
confirm = 2
show = false

[mqtt]
host = 192.168.0.10       ; 라즈베리파이 브로커 주소 (같은 파이에서 실행하면 127.0.0.1)
port = 1883
; username =              ; 비우면 scanner id 사용
password_file = config/dock-01.pass   ; 첫 줄이 비밀번호. 또는 환경 변수 BARCODE_MQTT_PASSWORD
keepalive = 30

[outbox]
path = data/outbox.db
retention_days = 7        ; 전송 완료된 기록 보관 일수 (미전송 기록은 지우지 않음)
