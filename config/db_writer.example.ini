; DB 저장 서비스(2단계) 설정 예시. 복사해서 config/db_writer.ini로 쓴다 (git에 올라가지 않음)
;   python -m barcode_system.db_writer_app --config config/db_writer.ini
; 명령줄 옵션이 이 파일보다 우선한다. 상대 경로는 실행 위치(작업 폴더) 기준이다.

[mqtt]
host = 127.0.0.1          ; 브로커와 같은 파이에서 실행
port = 1883
username = db-writer      ; mosquitto/pi/acl 의 읽기 전용 사용자
password_file = config/db-writer.pass   ; 첫 줄이 비밀번호. 또는 환경 변수 BARCODE_DB_MQTT_PASSWORD
client_id = db-writer     ; 영속 세션 이름. 바꾸면 브로커가 보관 중인 메시지를 받지 못한다
keepalive = 30

[db]
path = data/barcodes.db
spool = data/db_spool.jsonl   ; DB 기록 실패 시 임시 보관 파일
