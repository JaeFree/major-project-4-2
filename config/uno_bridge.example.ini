; UNO 브리지(3단계) 설정 예시. 복사해서 config/uno_bridge.ini로 쓴다 (git에 올라가지 않음)
;   python -m barcode_system.uno_bridge_app --config config/uno_bridge.ini
; 명령줄 옵션이 이 파일보다 우선한다.

[mqtt]
host = 127.0.0.1          ; 브로커와 같은 파이에서 실행
port = 1883
username = uno-bridge     ; mosquitto/pi/acl 의 읽기 전용 사용자
password_file = config/uno-bridge.pass   ; 또는 환경 변수 BARCODE_UNO_MQTT_PASSWORD
client_id = uno-bridge
keepalive = 30

[serial]
port = auto               ; auto | /dev/ttyUSB0 (CH340/CH341) | /dev/ttyACM0 (정품 UNO) | COM5 (Windows)
baud = 115200             ; arduino/uno_display/pins.h 의 SERIAL_BAUD와 같게

[display]
max_age = 30              ; 이보다 오래된 저장 결과는 표시하지 않음(초)
ping_interval = 5         ; 연결 확인 주기(초). UNO는 12초 동안 아무것도 없으면 NO LINK
