# 물류창고 바코드 시스템 — 라즈베리파이 Mosquitto 설정
# 설치 위치: /etc/mosquitto/conf.d/barcode.conf   (setup_broker.sh가 복사)
#
# 데비안/라즈베리파이 OS 기본 /etc/mosquitto/mosquitto.conf 에 이미 들어 있는 설정:
#   persistence true / persistence_location /var/lib/mosquitto/ / log_dest file ... / include_dir conf.d
# → 영속성은 기본으로 켜져 있다. 여기서는 저장 주기만 조정한다.
# tests/test_pipeline.py 가 이 파일의 autosave_* / max_queued_* / persistent_* 줄을 그대로 써서 검증한다.

# 모든 리스너에 같은 인증·ACL을 적용
per_listener_settings false

# 내부망 전체에서 접속 (TLS는 필요 시 이후 단계에서 8883 리스너로 추가)
listener 1883

# 사용자 인증 필수
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# 영속성: 보관 중인 메시지·retain 메시지·영속 세션을 디스크에 저장하는 시점
#   autosave_on_changes true + autosave_interval 1 → 메시지가 바뀔 때마다 저장 (2단계에서 변경)
#   이유: 스캐너는 브로커의 PUBACK을 받으면 전송 완료로 처리하므로, db-writer가 꺼져 있는 동안
#         브로커에 쌓인 메시지는 브로커가 비정상 종료되면 되살릴 곳이 없다.
#         저장마다 DB 파일 전체를 다시 쓰므로, 스캔량이 아주 많아져 SD카드 부담이 걱정되면
#         autosave_interval 값을 키운다 (예: 100 → 변경 100건마다 저장).
#   (이전 설정: autosave_interval 60 → 60초마다 저장)
autosave_on_changes true
autosave_interval 1

# 구독자(db-writer)가 끊겨 있는 동안 영속 세션에 쌓아 둘 최대 메시지 수.
# ※ 넘치면 그 뒤의 메시지는 브로커가 버린다 (스캐너는 이미 PUBACK을 받은 상태)
max_queued_messages 100000
# 접속하지 않는 영속 세션을 정리하는 기간 (client_id를 바꿔 버려진 세션이 계속 쌓이지 않도록)
persistent_client_expiration 30d
# 너무 큰 메시지 거부 (스캔 메시지는 수백 바이트)
message_size_limit 65536
