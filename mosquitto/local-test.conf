# Windows 로컬 테스트용 Mosquitto 설정 (pytest가 직접 실행/종료한다)
#   D:\Tools\mosquitto\mosquitto.exe -c mosquitto\local-test.conf -v
# 1883은 Windows 서비스(수동 시작으로 변경됨)나 다른 브로커와 겹칠 수 있어 18830을 쓴다.
# localhost 전용이므로 익명 접속을 허용한다. 파이용 설정(인증·ACL·영속성)은 1단계에서 별도로 만든다.
listener 18830 127.0.0.1
allow_anonymous true
persistence false
